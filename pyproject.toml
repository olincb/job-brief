[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobbrief"
version = "0.1.0"
description = "Periodic email of job postings ranked against a prose profile, with a Google Sheet as memory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
