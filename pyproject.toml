[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobbrief"
version = "1.2.0"
description = "Periodic email of job postings ranked against a prose profile, with a Google Sheet as memory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["google-auth"]  # signs the service account's RS256 JWT; see docs/design.md

[project.optional-dependencies]
web = ["flask", "waitress"]  # the web app only; the engine stays standard library plus google-auth
dev = ["pytest", "jobbrief[web]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
